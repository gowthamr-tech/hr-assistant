# Production overlay for a single host. Put a TLS-terminating reverse proxy in front.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Needs a .env with APP_ENV=production, AUTH_MODE=jwt|gateway and its secret, and the
# LLM provider key (see .env.example). The service refuses to start otherwise.
services:
  assistant:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports: !override
      - "127.0.0.1:8000:8000"   # only the local reverse proxy can reach it
    environment:
      APP_ENV: production
      LOG_FORMAT: json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID     # the entrypoint drops from root to the data owner / uid 10001
      - SETGID
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
