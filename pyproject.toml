[project]
name = "hr-assistant"
version = "1.0.0"
description = "HR policy and leave assistant over HTTP"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",  # a few long user-facing strings and regexes; code itself stays within 120
    "S101",  # assert in tests
    "S608",  # all SQL is parameterised; f-strings only add placeholders (see repositories.py)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "F811"]  # F811: fixtures imported from conftest modules
