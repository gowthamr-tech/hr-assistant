name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.5
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run the test suite inside the image
        run: |
          docker build --target test -t hr-assistant-test .
          docker run --rm hr-assistant-test
      - name: Build the runtime image
        run: docker build --target runtime --build-arg APP_VERSION=${{ github.sha }} -t hr-assistant:${{ github.sha }} .
      - name: Runtime image refuses an unsafe production config
        run: |
          if docker run --rm -e APP_ENV=production hr-assistant:${{ github.sha }} \
               python -c "from app.config import load_settings; load_settings()"; then
            echo "expected start-up to fail with AUTH_MODE=header in production"; exit 1
          fi
